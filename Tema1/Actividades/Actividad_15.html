<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body{ font-family: Arial, Helvetica, sans-serif; margin:24px; color:#111 }
		.wrap{ max-width:820px; margin:0 auto }
		h1{ font-size:28px; margin-bottom:8px }

		.table-wrap{ overflow-x:auto }
		table.order{ width:100%; border-collapse:collapse; min-width:620px }
		table.order th, table.order td{ border:1px solid #999; padding:8px 10px; }
		table.order th{ background:#eee; font-weight:700; text-align:left }

		table.order tfoot td{ font-weight:700; text-align:right; padding-top:12px }
		table.order tfoot td.total{ text-align:right }

		.qty, .price, .subtotal{ text-align:right }

	</style>
</head>
<body>
	<div class="wrap">
		<h1>Su pedido</h1>
		<div class="table-wrap">
					<table class="order" aria-label="Su pedido">
						<caption style="caption-side:top; text-align:left; margin-bottom:6px"></caption>
						<thead>
							<tr>
								<th scope="col">Nombre producto</th>
								<th scope="col" class="price">Precio unitario</th>
								<th scope="col" class="qty">Unidades</th>
								<th scope="col" class="subtotal">Subtotal</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>Reproductor MP3 (80 GB)</td>
								<td class="price">192.02</td>
								<td class="qty">1</td>
								<td class="subtotal">192.02</td>
							</tr>
							<tr>
								<td>Fundas de colores</td>
								<td class="price">2.50</td>
								<td class="qty">5</td>
								<td class="subtotal">12.50</td>
							</tr>
							<tr>
								<td>Reproductor de radio &amp; control remoto</td>
								<td class="price">12.99</td>
								<td class="qty">1</td>
								<td class="subtotal">12.99</td>
							</tr>
						</tbody>
						<tfoot>
							<tr>
								<td colspan="2" style="text-align:center; font-weight:700; border-top:2px solid #999">TOTAL</td>
								<td class="qty" style="border-top:2px solid #999">7</td>
								<td class="subtotal" style="border-top:2px solid #999">207.51</td>
							</tr>
						</tfoot>
					</table>
		</div>
	</div>
</body>
</html>
