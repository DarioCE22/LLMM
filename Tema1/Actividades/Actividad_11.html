<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista simple formateada</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f8f8f8;
    }
    div {
      border: 2px solid #333;
      padding: 20px;
      margin-bottom: 30px;
      background-color: #fff;
      border-radius: 10px;
      width: 400px;
    }
    h1 {
      color: #111;
    }
    ul, ol {
      margin-left: 30px;
    }
    em {
      font-style: italic;
    }
    strong {
      font-weight: bold;
    }
  </style>
</head>
<body>
    <h1>Menú</h1>
    <ul>
        <li>Inicio</li>
        <li>Noticias
            <ul>
                <li><a href="#">Recientes</a></li>
                <li><a href="#">Más leídas</a></li>
                <li><a href="#">Más valoradas</a></li>
            </ul>
        </li>
    </ul>
    <li>Artículos
        <ol>
          <li><a href="#">XHTML</a></li>
          <li><a href="#">CSS</a></li>
          <li><a href="#">JavaScript</a></li>
          <li><a href="#">Otros</a></li>
        </ol>
      </li>
      <li>Contacto</li>
    </ul>
    <p><em>Email</em><br>
      <strong>nombre@direccion.com</strong>
    </p>
    <p><em>Teléfono</em><br>
      900 900 900
    </p>
    <p><em>Fax</em><br>
      900 900 900
    </p>
  </div>
</body>
</html>
