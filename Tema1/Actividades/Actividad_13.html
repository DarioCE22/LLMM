<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:24px; color:#012; }
		.container{ max-width:920px; margin:0 auto; }
		h1{ margin-bottom:8px; }
		p.lead{ margin-top:0; color:#245; }

		table.exercise{
			width:100%;
			border-collapse:collapse;
			table-layout:fixed;
			margin-top:18px;
		}
		table.exercise td, table.exercise th{
			border:1px solid #cdd;
			padding:10px 8px;
			text-align:center;
			vertical-align:middle;
			background: linear-gradient(#fbffff,#f2fbfb);
		}
		table.exercise th{
			background: linear-gradient(#e6f7f7,#d9f0f0);
			font-weight:700;
			color:#045;
		}

		.highlight{ background: linear-gradient(#dff7f7,#cfecec); }

		@media (max-width:560px){
			table.exercise td, table.exercise th{ padding:8px 6px; font-size:14px }
		}
	</style>
</head>
<body>
	<div class="container">

		<table class="exercise" aria-label="Tabla actividad 13">
			<tr>
				<th colspan="5">Horario semanal - Actividad 13</th>
			</tr>

			<tr>
				<th>Hora</th>
				<th>Lunes</th>
				<th>Martes</th>
				<th>Mié</th>
				<th>Jue</th>
			</tr>

			<tr>
				<td rowspan="3" class="highlight">8:00 - 10:00</td>
				<td>Matemáticas</td>
				<td>Física</td>
				<td>Lengua</td>
				<td>Historia</td>
			</tr>
			<tr>
				<td>Biología</td>
				<td>Química</td>
				<td>Arte</td>
				<td>Inglés</td>
			</tr>
			<tr>
				<td colspan="2">Educación Física (doble sesión)</td>
				<td>Optativa</td>
				<td>Repaso</td>
			</tr>

			<tr>
				<td colspan="5" style="text-align:left; padding:12px; background:#eef; color:#045">Nota: Esta tabla es un ejemplo que usa <code>rowspan</code> y <code>colspan</code>.</td>
			</tr>
		</table>

	</div>
</body>
</html>
