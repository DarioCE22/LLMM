<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo ASIR - Expresiones Regulares</title>
    <style>
body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745; /* Verde */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #resultado {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none; /* Oculto al inicio */
            font-weight: bold;
        }

        .valido {
            display: block !important;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .invalido {
            display: block !important;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

        <div class="ejercicio-caja">
            <h2>Ejercicio 2: Formato de DNI</h2>
            <p>Debe tener exactamente 8 números y 1 letra mayúscula al final.</p>
            
            <label>Introduce el DNI:</label>
            <input type="text" id="inputDNI" placeholder="Ej: 12345678X">
            
            <button onclick="validarDNI()">Comprobar DNI</button>
            <div id="resultadoDNI" class="resultado"></div>
        </div>

    </div>

    <script>
        function validarDNI() {
            var dni = document.getElementById("inputDNI").value;
            var cajaResultado = document.getElementById("resultadoDNI");
            
            // Expresión regular para el DNI (8 números y 1 letra mayúscula)
            var patronDNI = /^\d{8}[A-Z]$/;

            // Comprobamos usando .test()
            if (patronDNI.test(dni) === true) {
                cajaResultado.innerHTML = "✅ El formato del DNI es correcto.";
                cajaResultado.className = "resultado valido";
            } else {
                cajaResultado.innerHTML = "❌ Formato inválido. Recuerda: 8 números y 1 mayúscula sin espacios.";
                cajaResultado.className = "resultado invalido";
            }
        }
    </script>

</body>
</html>
