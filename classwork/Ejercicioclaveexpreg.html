<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo ASIR - Expresiones Regulares</title>
    <style>
body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745; /* Verde */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #resultado {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none; /* Oculto al inicio */
            font-weight: bold;
        }

        .valido {
            display: block !important;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .invalido {
            display: block !important;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <h1>Práctica: Expresiones Regulares</h1>

        <div class="ejercicio-caja">
            <h2>Ejercicio 1: Clave Segura</h2>
            <p>Debe tener 8 caracteres mínimo, 1 mayúscula, 1 minúscula y 1 número.</p>
            
            <label>Introduce la contraseña:</label>
            <input type="text" id="inputClave" placeholder="Ej: Admin1234">
            
            <button onclick="validarClave()">Comprobar Clave</button>
            <div id="resultadoClave" class="resultado"></div>
        </div>
    </div>

    <script>
        function validarClave() {
            var clave = document.getElementById("inputClave").value;
            var cajaResultado = document.getElementById("resultadoClave");
            
            // Expresión regular para la clave
            var patronClave = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$/;

            // Comprobamos usando .test()
            if (patronClave.test(clave) === true) {
                cajaResultado.innerHTML = "✅ ¡Éxito! La contraseña es segura.";
                cajaResultado.className = "resultado valido";
            } else {
                cajaResultado.innerHTML = "❌ Error: La contraseña no cumple los requisitos.";
                cajaResultado.className = "resultado invalido";
            }
        }
    </script>

</body>
</html>
