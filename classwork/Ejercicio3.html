<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de Números</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        
        .container { 
            background-color: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            max-width: 600px; 
        }

        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }

        label { display: block; margin-top: 10px; font-weight: bold; color: #444; }
        
        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 50%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 15px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e0e0e0;
            border: 1px solid #999;
            border-radius: 3px;
        }
        button:hover { background-color: #d0d0d0; }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #e6e6fa;
            border-left: 5px solid #ccc;
            min-height: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Suma de dos números</h1>
        <p>Introduce dos números y pulsa el botón para ver la suma.</p>

        <label for="num1">Número 1:</label>
        <input type="number" id="num1" placeholder="0">

        <label for="num2">Número 2:</label>
        <input type="number" id="num2" placeholder="0">

        <br>
        <button onclick="realizarSuma()">Sumar</button>

        <div id="resultado"></div>
    </div>

    <script>
        function realizarSuma() {
            var valor1 = document.getElementById("num1").value;
            var valor2 = document.getElementById("num2").value;

            if (valor1 === "" || valor2 === "") {
                document.getElementById("resultado").innerHTML = "Por favor, introduce los dos números.";
                return;
            }

            var numero1 = parseFloat(valor1);
            var numero2 = parseFloat(valor2);

            var total = numero1 + numero2;

            document.getElementById("resultado").innerHTML = total;
        }
    </script>

</body>
</html>
