<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tabla</title>

    <style>
        table { border:1px solid black; }
        td, th { border:1px solid black; padding:5px; }
        div { margin: 10px; padding: 10px; }
    </style>
</head>

<body>

    <!-- TÍTULO -->
    <div>
        <h2>Mi Tabla de Datos de CS-GO</h2>
    </div>

    <!-- TABLA CON ROWSPAN Y COLSPAN -->
    <div>
        <table>
            <tr>
                <th colspan="3">Ratio de victorias/derrotas</th>
            </tr>

            <tr>
                <td rowspan="2">47,8% wr</td>
                <td>47 victorias en casual</td>
                <td>112 victorias en clasificadas</td>
            </tr>

            <tr>
                <td>27 derrotas en casual</td>
                <td>49 derrotas en clasificadas</td>
            </tr>
        </table>
    </div>

    <!-- ENLACE PARA VOLVER -->
    <div>
        <a href="../index.html">Volver a la página principal</a>
    </div>

</body>
</html>
